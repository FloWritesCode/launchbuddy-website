version: 1
researched_at: "2026-07-13"
market: "English-language web search"
status: "initial"

methodology:
  - "Compared candidate topics against all 24 existing posts in src/content/blog."
  - "Used current Google result language, Apple documentation terminology, competitor positioning, and LaunchBuddy product fit."
  - "Priorities are qualitative. They do not claim exact search volume or keyword difficulty."
  - "Before drafting, recheck the live search results and reject topics whose intent is already satisfied by an existing LaunchBuddy article."

selection_policy:
  order: ["P0", "P1", "P2"]
  publish_at_most: 1
  stop_when_no_approved_item: true
  statuses:
    approved: "Available for the publishing automation."
    drafting: "Reserved by an active run."
    published: "Article is live; published_url must be set."
    rejected: "Do not publish; record a reason."

