excluded_due_to_overlap:
  - keyword: "iOS app project management"
    reason: "High overlap with iOS developer task manager, App Store Connect project management, and iOS app release management. Consolidate or retarget an existing article instead."
  - keyword: "Xcode project manager"
    reason: "Already targeted as a close variant by ios-developer-task-manager.md."
  - keyword: "app release checklist"
    reason: "Already covered by the App Store Connect release and iOS launch checklist articles."
  - keyword: "AI App Store Connect"
    reason: "Severe overlap across the AI workflow, AI agent, MCP workflow, and automation articles."
  - keyword: "App Store Connect integration"
    reason: "Broad intent is already split across API, API workflow, automation, and MCP articles."
  - keyword: "iOS release notes generator"
    reason: "Already covered by two release-note articles."
  - keyword: "TestFlight management"
    reason: "Existing release-management and feedback-management pages jointly satisfy the intent."
  - keyword: "how to respond to App Store reviews"
    reason: "The App Store review reply generator article already explains response mechanics, structure, prioritization, and publishing."
  - keyword: "how to respond to negative App Store reviews"
    reason: "The App Store review reply generator article includes negative-review patterns, safety checks, and one-star guidance."
  - keyword: "App Store review reply examples"
    reason: "The App Store review reply generator article already contains templates for bugs, crashes, feature requests, pricing complaints, praise, and low-detail ratings."
  - keyword: "App Store review response best practices"
    reason: "The App Store review reply generator article already owns response structure, safety, mistakes, and human-review guidance."
  - keyword: "AI App Store review reply generator"
    reason: "Exact intent is already owned by app-store-review-reply-generator.md."
  - keyword: "App Store Connect analytics dashboard"
    reason: "The App Store Connect analytics guide already covers the dashboard, metrics, and weekly analysis workflow."
  - keyword: "App Store analytics for indie developers"
    reason: "The App Store Connect analytics guide explicitly targets indie developers and small apps."
  - keyword: "track iOS app downloads and revenue"
    reason: "The App Store Connect analytics guide already covers downloads, sales, proceeds, and revenue."
  - keyword: "App Store subscription analytics"
    reason: "The App Store Connect analytics guide already covers active plans, MRR, conversion, churn, and subscription metrics."
  - keyword: "App Store A/B testing"
    reason: "This is the same search intent as the approved App Store product page optimization candidate; Apple identifies Product Page Optimization as its native A/B testing workflow."
  - keyword: "app icon A/B testing"
    reason: "This is a narrow treatment variation of the approved App Store product page optimization candidate, which already covers Apple's special binary requirement for icon tests."
  - keyword: "App Store screenshot A/B testing"
    reason: "This is a narrow treatment variation of the approved App Store product page optimization candidate rather than a distinct article intent."
  - keyword: "App Store privacy details checklist"
    reason: "The existing App Store Connect release checklist already owns the submission-checklist intent, while LaunchBuddy cannot inspect an app binary, SDK behavior, privacy manifest, or legal policy for correctness."
  - keyword: "iOS app release readiness audit"
    reason: "Current results primarily expect source, binary, entitlement, and privacy-manifest scanning. LaunchBuddy's verified readiness artifact and checklists do not inspect code or guarantee App Review compliance."
  - keyword: "App Store post-release monitoring checklist"
    reason: "Substantially the same intent is already reserved by the approved iOS post-launch checklist entry, which covers reviews, analytics, crashes, support, and follow-up tasks."
  - keyword: "custom app release checklist"
    reason: "The existing App Store Connect release checklist already provides an adaptable template and explains reusable LaunchBuddy checklists; live results did not establish a separate customization intent."
  - keyword: "Siri Shortcuts for developers"
    reason: "This is a minor phrasing variation of the approved iOS Shortcuts for app developers entry. Apple's App Intents documentation treats Siri and the Shortcuts app as surfaces for the same App Shortcuts."
  - keyword: "Mac menu bar project manager"
    reason: "Current results and the proposed angle substantially match the approved Mac menu bar task tracker for developers entry; the broader wording does not establish a separate project-management intent."
  - keyword: "app idea capture workflow"
    reason: "The published iOS app idea backlog guide already covers low-friction capture, a compact decision card, intake review, the Create App Idea widget, deep links, and the boundary between capture and commitment."
  - keyword: "iOS release planning template"
    reason: "The published iOS app release management guide already includes a version-scoped planning template covering goal, scope, TestFlight, App Store Connect, submission, and follow-up."
  - keyword: "app portfolio prioritization"
    reason: "The approved indie app portfolio management entry can own grow, maintain, park, and sunset allocation decisions; a separate prioritization article would target substantially the same portfolio operating intent."
  - keyword: "App Store Connect status meanings"
    reason: "The published App Store submission tracker already maps Apple submission states to next actions, while the App Store Connect help article covers status-led troubleshooting. A separate glossary would substantially repeat both."
  - keyword: "TestFlight internal vs external testing"
    reason: "The published TestFlight release management guide already compares internal and external testing, tester access, Beta App Review, feedback routing, and the release handoff."
  - keyword: "iOS app versioning strategy"
    reason: "The accepted iOS version number vs build number candidate owns Apple's version/build distinction. A broader strategy article would also overlap the approved release-cadence topic and invite unsupported universal Semantic Versioning advice."
  - keyword: "LaunchBuddy vs Todoist"
    reason: "Current results show generic personal-task-manager intent with little App Store release specificity. The Trello, Jira, and GitHub Projects comparisons provide clearer workflow boundaries and stronger original value."
  - keyword: "iOS app maintenance checklist"
    reason: "Substantially overlaps the approved post-launch, cadence, retrospective, hotfix, portfolio, and sunset topics, while current results expect crash, dependency, security, compatibility, and policy checks that LaunchBuddy cannot perform."
  - keyword: "LaunchBuddy vs Jira"
    reason: "The published LaunchBuddy vs Linear and LaunchBuddy vs Notion articles already own the team issue-tracker and configurable-workspace comparison intent. Jira-specific sprint and timeline details do not create enough distinct LaunchBuddy value for another article."

