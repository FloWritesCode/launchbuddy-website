<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Published impression-to-page-view rates compared</title>
  <desc id="desc">FunnelHound puts typical search tap-through at 3 to 6 percent and says browse usually runs lower. BenchHacks lists 4.8 percent for App Store Search and 11 percent for App Store Browse in the US. LaunchBuddy uses a 3 to 10 percent band with a 5 percent median.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif; }
    .title { fill: #f5f7fb; font-size: 26px; font-weight: 650; }
    .subtitle { fill: #a1adc0; font-size: 16px; }
    .label { fill: #f5f7fb; font-size: 17px; font-weight: 600; }
    .sub { fill: #6b778c; font-size: 14px; }
    .value { fill: #f5f7fb; font-size: 15px; font-weight: 600; }
    .muted { fill: #a1adc0; font-size: 15px; }
    .axis { fill: #6b778c; font-size: 14px; }
    .note { fill: #6b778c; font-size: 13px; }
    .grid { stroke: #ffffff; stroke-opacity: 0.07; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="519" rx="20" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="title" x="40" y="58">Impression to page view: sources disagree</text>
  <text class="subtitle" x="40" y="88">Published tap-through rates, App Store search vs browse</text>

  <g class="grid">
    <line x1="290" y1="120" x2="290" y2="400"/>
    <line x1="446.7" y1="120" x2="446.7" y2="400"/>
    <line x1="603.3" y1="120" x2="603.3" y2="400"/>
    <line x1="760" y1="120" x2="760" y2="400"/>
  </g>

  <text class="label" x="40" y="152">LaunchBuddy band</text>
  <text class="sub" x="40" y="172">All traffic</text>
  <rect x="384" y="146" width="219.3" height="20" rx="5" fill="#2f7bff" fill-opacity="0.35" stroke="#5ea1ff" stroke-width="1.5"/>
  <line x1="446.7" y1="141" x2="446.7" y2="171" stroke="#f5f7fb" stroke-width="3" stroke-linecap="round"/>
  <text class="muted" x="613" y="161">3&#8211;10%, median 5%</text>

  <text class="label" x="40" y="218">FunnelHound</text>
  <text class="sub" x="40" y="238">Search, typical</text>
  <rect x="384" y="212" width="94" height="20" rx="5" fill="#22d3ee" fill-opacity="0.8"/>
  <text class="value" x="488" y="227">3&#8211;6%</text>

  <text class="label" x="40" y="284">FunnelHound</text>
  <text class="sub" x="40" y="304">Browse and featuring</text>
  <text class="muted" x="290" y="293">"Usually run lower" than search, no number given</text>

  <text class="label" x="40" y="350">BenchHacks (US)</text>
  <text class="sub" x="40" y="370">Search vs browse</text>
  <line x1="440.4" y1="354" x2="634.7" y2="354" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="440.4" cy="354" r="9" fill="#22d3ee"/>
  <circle cx="634.7" cy="354" r="9" fill="#d062f5"/>
  <text class="value" x="440.4" y="334" text-anchor="middle">Search 4.8%</text>
  <text class="value" x="634.7" y="334" text-anchor="middle">Browse 11%</text>

  <line x1="290" y1="400" x2="760" y2="400" stroke="#ffffff" stroke-opacity="0.18"/>
  <text class="axis" x="290" y="424" text-anchor="middle">0%</text>
  <text class="axis" x="446.7" y="424" text-anchor="middle">5%</text>
  <text class="axis" x="603.3" y="424" text-anchor="middle">10%</text>
  <text class="axis" x="760" y="424" text-anchor="middle">15%</text>

  <text class="note" x="40" y="468">Sources: FunnelHound, App Store Impressions vs Product Page Views; BenchHacks, AppStore</text>
  <text class="note" x="40" y="488">Benchmarks 2026 (US market, qualitative research). The band is LaunchBuddy's synthesis.</text>
</svg>
