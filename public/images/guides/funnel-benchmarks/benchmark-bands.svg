<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
  <title id="title">LaunchBuddy funnel benchmark bands</title>
  <desc id="desc">Typical ranges and medians LaunchBuddy uses for each funnel step: impressions to page views 3 to 10 percent with a 5 percent median, page views to downloads 20 to 40 percent with a 30 percent median, no benchmark for downloads to first opens, downloads to trials 4 to 9.1 percent with a 5.5 percent median, and trials to paid 22.2 to 43.5 percent with a 32 percent median.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif; }
    .title { fill: #f5f7fb; font-size: 26px; font-weight: 650; }
    .subtitle { fill: #a1adc0; font-size: 16px; }
    .step { fill: #f5f7fb; font-size: 18px; font-weight: 600; }
    .source { fill: #6b778c; font-size: 14px; }
    .value { fill: #a1adc0; font-size: 15px; }
    .axis { fill: #6b778c; font-size: 14px; }
    .note { fill: #6b778c; font-size: 13px; }
    .grid { stroke: #ffffff; stroke-opacity: 0.07; }
    .band { fill: #2f7bff; fill-opacity: 0.35; stroke: #5ea1ff; stroke-width: 1.5; }
    .median { stroke: #f5f7fb; stroke-width: 3; stroke-linecap: round; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="689" rx="20" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="title" x="40" y="58">The benchmark bands behind the funnel</text>
  <text class="subtitle" x="40" y="88">Typical range (bar) and median (white tick) for each step, all categories</text>

  <g class="grid">
    <line x1="290" y1="120" x2="290" y2="550"/>
    <line x1="384" y1="120" x2="384" y2="550"/>
    <line x1="478" y1="120" x2="478" y2="550"/>
    <line x1="572" y1="120" x2="572" y2="550"/>
    <line x1="666" y1="120" x2="666" y2="550"/>
    <line x1="760" y1="120" x2="760" y2="550"/>
  </g>

  <text class="step" x="40" y="160">Impressions &#8594; Page views</text>
  <text class="source" x="40" y="182">FunnelHound, BenchHacks</text>
  <text class="value" x="318" y="146">3&#8211;10% &#183; median 5%</text>
  <rect class="band" x="318.2" y="156" width="65.8" height="20" rx="5"/>
  <line class="median" x1="337" y1="151" x2="337" y2="181"/>

  <text class="step" x="40" y="246">Page views &#8594; Downloads</text>
  <text class="source" x="40" y="268">Appalize 2026</text>
  <text class="value" x="478" y="232">20&#8211;40% &#183; median 30%</text>
  <rect class="band" x="478" y="242" width="188" height="20" rx="5"/>
  <line class="median" x1="572" y1="237" x2="572" y2="267"/>

  <text class="step" x="40" y="332">Downloads &#8594; First opens</text>
  <text class="source" x="40" y="354">No source</text>
  <rect x="290" y="324" width="470" height="20" rx="5" fill="none" stroke="#6b778c" stroke-dasharray="5 5"/>
  <text class="value" x="525" y="339" text-anchor="middle">No reliable public benchmark</text>

  <text class="step" x="40" y="418">Downloads &#8594; Trials</text>
  <text class="source" x="40" y="440">RevenueCat SOSA 2026</text>
  <text class="value" x="328" y="404">4&#8211;9.1% &#183; median 5.5%</text>
  <rect class="band" x="327.6" y="414" width="47.9" height="20" rx="5"/>
  <line class="median" x1="341.7" y1="409" x2="341.7" y2="439"/>

  <text class="step" x="40" y="504">Trials &#8594; Paid</text>
  <text class="source" x="40" y="526">RevenueCat SOSA 2026</text>
  <text class="value" x="499" y="490">22.2&#8211;43.5% &#183; median 32%</text>
  <rect class="band" x="498.7" y="500" width="200.2" height="20" rx="5"/>
  <line class="median" x1="590.8" y1="495" x2="590.8" y2="525"/>

  <line x1="290" y1="550" x2="760" y2="550" stroke="#ffffff" stroke-opacity="0.18"/>
  <text class="axis" x="290" y="574" text-anchor="middle">0%</text>
  <text class="axis" x="384" y="574" text-anchor="middle">10%</text>
  <text class="axis" x="478" y="574" text-anchor="middle">20%</text>
  <text class="axis" x="572" y="574" text-anchor="middle">30%</text>
  <text class="axis" x="666" y="574" text-anchor="middle">40%</text>
  <text class="axis" x="760" y="574" text-anchor="middle">50%</text>

  <text class="note" x="40" y="622">Ranges span the published category figures. The 5%, 5.5% and 32% medians are LaunchBuddy's</text>
  <text class="note" x="40" y="642">reference points derived from those sources; see the guide for how each one was chosen.</text>
</svg>
