# Screenshot catalog for LaunchBuddy blog posts and the daily blog automation.
# Prefer these existing assets over inventing or generating new images.
# Use 0–2 screenshots per article, only when they clarify a concrete UI or workflow.
# Markdown form:
#   ![Descriptive alt text](/screenshots/<path>)
# Never claim a screenshot shows data, metrics, or capabilities it does not show.
# ASC screenshots are redacted; do not invent the obscured values in prose.

screenshots:
  - path: /screenshots/launchbuddy/ai.jpg
    product: launchbuddy
    subjects: [ai, playbooks, approval-gated actions, sessions]
    best_for:
      - AI App Store Connect workflows
      - human-in-the-loop approval
      - LaunchBuddy MCP / agent playbooks
    alt_hint: LaunchBuddy AI home with approval-gated playbooks for releases, reviews, and analytics

  - path: /screenshots/launchbuddy/overview.jpg
    product: launchbuddy
    subjects: [app overview, metadata, App Store URL, bundle id, ASC app id]
    best_for:
      - portfolio / project management
      - LaunchBuddy vs App Store Connect comparisons
      - app overview and metadata context
    alt_hint: LaunchBuddy overview showing app status, App Store URL, bundle ID, and ASC app ID

  - path: /screenshots/launchbuddy/releases.jpg
    product: launchbuddy
    subjects: [releases, kanban, version, changelog, push to ASC]
    best_for:
      - iOS release management
      - release cadence and task boards
      - release notes workflows
    alt_hint: LaunchBuddy Releases board with backlog tasks, version metadata, and changelog draft

  - path: /screenshots/launchbuddy/analytics.jpg
    product: launchbuddy
    subjects: [analytics dashboard, impressions, page views, conversion, installs]
    best_for:
      - LaunchBuddy analytics sections
      - Free vs Pro feature explanations
      - post-launch monitoring in LaunchBuddy
    alt_hint: LaunchBuddy App Store Analytics dashboard with impressions, page views, conversion, and installs
    caveats:
      - Shows a focused LaunchBuddy snapshot, not Apple's full Analytics suite

  - path: /screenshots/launchbuddy/customer-reviews.jpg
    product: launchbuddy
    subjects: [reviews inbox, ratings, replied status, multilingual reviews]
    best_for:
      - App Store review management
      - review reply workflows
      - turning reviews into product work
    alt_hint: LaunchBuddy Customer Reviews inbox with ratings, locales, and replied status

  - path: /screenshots/app-store-connect/analytics-overview.jpg
